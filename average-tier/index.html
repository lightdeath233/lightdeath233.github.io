<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者荣耀英雄强度分析系统</title>

    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

    <style>
        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* ================= 工具栏 ================= */

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #1677ff;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #0f5ed7;
        }

        #selectedHero {
            font-size: 15px;
        }

        /* ================= 左右布局 ================= */

        .main-layout {
            display: flex;
            gap: 20px;
        }

        .left-panel {
            flex: 3;
        }

        .right-panel {
            flex: 1;
        }

        /* ================= 图表 ================= */

        #chart {
            width: 100%;
            height: 700px;
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
        }

        /* ================= 排行榜 ================= */

        #rankPanelWrapper {
            background: white;
            border-radius: 12px;
            padding: 15px;
            height: 700px;
            overflow-y: auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
        }

        #rankSearchInput {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        .rank-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .rank-item img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        /* ================= modal ================= */

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hidden {
            display: none;
        }

        .modal-content {
            width: min(900px, 95vw);
            height: 85vh;

            background: white;
            border-radius: 15px;

            display: flex;
            flex-direction: column;
        }

        #searchInput {
            margin: 15px 15px 10px;
            width: calc(100% - 30px);
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        #selectedPreview {
            margin: 0 15px 10px;
            background: #f7f7f7;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        /* ================= 英雄列表 ================= */

        #heroGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            flex: 1;
            overflow-y: auto;

            padding: 10px;
        }

        .hero-item {
            text-align: center;
            cursor: pointer;
            padding: 10px;
            border-radius: 12px;
            transition: .2s;
        }

        .hero-item:hover {
            background: #f0f0f0;
        }

        .hero-item img {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            object-fit: cover;
        }

        .hero-item div {
            font-size: 13px;
            margin-top: 5px;
        }

        /* ================= 底部按钮 ================= */

        .modal-actions {

            position: sticky;

            bottom: 0;

            background: white;

            padding: 10px;

            border-top: 1px solid #eee;

            display: flex;

            gap: 10px;

            z-index: 100;
        }

        .modal-actions button {
            flex: 1;
        }

        @media (max-width:768px) {

            body {
                padding: 0;
            }

            .container {
                padding: 0;
            }

            h2 {
                font-size: 22px;
            }

            .toolbar {
                flex-direction: column;
            }

            .toolbar button {
                width: 100%;
            }

            #selectedHero {
                width: 100%;
                text-align: center;
            }

            .main-layout {
                flex-direction: column;
            }

            #chart {
                width: 100%;
                aspect-ratio: 1.2/1;
                height: auto;
            }

            #rankPanelWrapper {
                height: auto;
            }

            #heroGrid {
                grid-template-columns: repeat(3, 1fr);
            }

            .hero-item img {
                width: 64px;
                height: 64px;
            }

            .modal-content {
                width: 95vw;
                height: 90vh;
                padding: 0;
            }

            .modal-actions {
                display: flex;
                gap: 10px;
            }

        }
    </style>
</head>

<body>

    <div class="container">

        <h2>王者荣耀英雄强度长期变化分析</h2>

        <!-- 工具栏 -->
        <div class="toolbar">
            <button id="openPicker">选择英雄</button>

            <!-- ⭐ 当前选择显示 -->
            <div id="selectedHero">当前英雄：未选择</div>

            <!-- ⭐ 清空按钮 -->
            <button id="clearSelect">清空选择</button>
        </div>

        <div class="main-layout">

            <div class="left-panel">

                <div id="chart"></div>

            </div>

            <div class="right-panel">

                <div id="rankPanelWrapper">

                    <input id="rankSearchInput" placeholder="搜索英雄（排行榜）..." />

                    <div id="rankPanel"></div>

                </div>

            </div>

        </div>

    </div>

    <!-- ================= 弹窗 ================= -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">

            <input type="text" id="searchInput" placeholder="搜索英雄..." />

            <!-- ⭐ 已选预览 -->
            <div id="selectedPreview">未选择任何英雄</div>

            <div id="heroGrid"></div>

            <!-- ⭐ 操作按钮 -->
            <div class="modal-actions">
                <button id="confirmSelect">确认选择</button>
                <button onclick="closeModal()">取消</button>
            </div>

        </div>
    </div>

    <!-- JS -->
    <script src="script.js?v=1.0.0"></script>

</body>

</html>
