<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者荣耀英雄强度分析系统</title>

    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>王者荣耀英雄强度长期变化分析</h2>

        <p class="source-line">
            数据源于<a href="https://space.bilibili.com/502750837" target="_blank" rel="noopener noreferrer">若要乘风起</a>
        </p>

        <!-- 工具栏 -->
        <div class="toolbar">
            <button id="openPicker">选择英雄</button>

            <!-- ⭐ 当前选择显示 -->
            <div id="selectedHero">当前英雄：未选择</div>

            <!-- ⭐ 清空按钮 -->
            <button id="clearSelect">清空选择</button>
        </div>

        <div class="main-layout">

            <div class="left-panel">

                <div id="chart"></div>

            </div>

            <div class="right-panel">

                <div id="rankPanelWrapper">

                    <input id="rankSearchInput" placeholder="搜索英雄（排行榜）..." />

                    <div id="rankPanel"></div>

                </div>

            </div>

        </div>

    </div>

    <!-- ================= 弹窗 ================= -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">

            <input type="text" id="searchInput" placeholder="搜索英雄..." />

            <!-- ⭐ 已选预览 -->
            <div id="selectedPreview">未选择任何英雄</div>

            <div id="heroGrid"></div>

            <!-- ⭐ 操作按钮 -->
            <div class="modal-actions">
                <button id="confirmSelect">确认选择</button>
                <button onclick="closeModal()">取消</button>
            </div>

        </div>
    </div>

    <!-- JS -->
    <script src="script.js?v=1.0.0"></script>

</body>

</html>
